<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Página não encontrada · ProjectScope</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #080b12;
      color: #f0f6fc;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(620px, calc(100% - 32px));
      padding: 42px;
      border: 1px solid #30363d;
      border-radius: 18px;
      background: #0d1117;
    }

    p {
      color: #8b949e;
      line-height: 1.7;
    }

    a {
      color: #58a6ff;
    }
  </style>
</head>

<body>
  <main style="text-align: center;">
    <p>Erro 404</p>
    <h1>PAGE NOT FOUND</h1>
    <p>A rota informada não corresponde a uma página ou card público do ProjectScope</p>
    <a href="/">Voltar para a página inicial</a>
  </main>
</body>

</html>
